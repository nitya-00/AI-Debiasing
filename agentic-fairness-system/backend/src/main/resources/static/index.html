<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairness Console</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f4f5fb;
      --panel-strong: #eceafd;
      --line: #e5e7f0;
      --line-strong: #cfd3e2;
      --ink: #17213a;
      --muted: #737b91;
      --muted-strong: #3e4862;
      --accent: #635bda;
      --accent-dark: #4d46b8;
      --accent-soft: rgba(99, 91, 218, 0.1);
      --warning: #b36a11;
      --warning-soft: rgba(179, 106, 17, 0.1);
      --danger: #c44755;
      --danger-soft: rgba(196, 71, 85, 0.1);
      --success: #23835b;
      --success-soft: rgba(35, 131, 91, 0.1);
      --shadow: 0 14px 34px rgba(28, 38, 76, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 78% -10%, rgba(99, 91, 218, 0.08), transparent 28%), var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      letter-spacing: -0.01em;
    }

    button, input {
      font: inherit;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      width: 260px;
      border-right: 1px solid var(--line);
      background: #ffffff;
      padding: 24px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6f67e8, #5149b9);
      color: #ffffff;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-label {
      padding: 0 10px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted-strong);
      border-left: 2px solid transparent;
      padding: 10px 12px 10px 14px;
      text-align: left;
      border-radius: 10px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .nav-item:hover {
      background: var(--accent-soft);
      color: var(--ink);
    }

    .nav-item.active {
      background: rgba(17, 24, 39, 0.04);
      border-left-color: var(--accent);
      color: var(--accent-dark);
    }

    .main-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding: 20px 30px;
      background: rgba(255,255,255,0.88);
    }

    .topbar .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .topbar strong {
      color: var(--ink);
      letter-spacing: -0.03em;
      text-transform: none;
      font-size: 1.05rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-strong);
      padding: 0;
      cursor: pointer;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px 6px 6px;
      background: var(--panel);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--muted-strong);
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--panel-strong);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid var(--line);
    }

    .page {
      padding: 28px 30px 38px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-surface {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.85);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px 0;
    }

    .hero-surface {
      position: relative;
      overflow: hidden;
      border: 1px solid #dcdafa;
      border-radius: var(--radius);
      padding: 28px 30px;
      color: #ffffff;
      background: linear-gradient(115deg, #312d73 0%, #5f57ce 60%, #8179ed 100%);
      box-shadow: 0 18px 38px rgba(73, 65, 179, 0.2);
    }

    .hero-surface::after {
      position: absolute;
      content: "";
      width: 260px;
      height: 260px;
      right: -70px;
      top: -120px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      box-shadow: 0 0 0 30px rgba(255,255,255,0.04), 0 0 0 60px rgba(255,255,255,0.03);
    }

    .hero-surface .eyebrow,
    .hero-surface .meta {
      color: rgba(255,255,255,0.7);
    }

    .hero-surface h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      letter-spacing: -0.055em;
      line-height: 1.04;
    }

    .hero-surface p:not(.eyebrow) {
      max-width: 560px;
      margin: 12px 0 0;
      color: rgba(255,255,255,0.78);
      line-height: 1.55;
    }

    .hero-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .hero-button {
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.13);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    .hero-button.primary {
      border-color: #ffffff;
      background: #ffffff;
      color: var(--accent-dark);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      letter-spacing: -0.04em;
    }

    .header-action {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-band {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      margin-top: 18px;
    }

    .metric-strip {
      padding: 20px 22px;
      border-right: 1px solid var(--line);
      min-height: 120px;
    }

    .metric-strip:last-child { border-right: none; }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .metric-value strong {
      font-size: clamp(1.9rem, 3vw, 2.5rem);
      line-height: 1;
    }

    .metric-value span {
      font-size: 0.82rem;
      color: var(--success);
      background: var(--success-soft);
      border-radius: 999px;
      padding: 5px 8px;
      font-weight: 700;
    }

    .metric-value.negative span {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .metric-sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 22px;
    }

    .panel-body {
      padding: 20px 22px 22px;
    }

    .trend-chart {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: end;
      gap: 12px;
      height: 200px;
      padding-top: 14px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
    }

    .bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      max-width: 42px;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, #d8e7df 0%, #5d8f87 100%);
      min-height: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .bar-label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .risk-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .risk-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 18px;
      align-items: center;
    }

    .risk-name {
      font-weight: 600;
      color: var(--muted-strong);
    }

    .risk-score {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
    }

    .progress {
      grid-column: 1 / -1;
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(17,24,39,0.06);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #99b3a6 0%, #0d5f58 100%);
    }

    .table-wrap {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.1);
    }

    thead th {
      text-align: left;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    tbody td {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted-strong);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-pill.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .status-pill.neutral {
      background: rgba(17, 24, 39, 0.04);
      color: var(--muted-strong);
    }

    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .form-surface {
      padding: 20px 22px 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .field input,
    .field select {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
    }

    .field select {
      min-height: 43px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 91, 218, 0.1);
    }

    .wizard {
      padding: 20px 22px 22px;
    }

    .wizard-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .wizard-step {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 2px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .wizard-step span {
      display: inline-flex;
      width: 24px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--panel-soft);
      color: var(--muted-strong);
      font-size: 0.72rem;
    }

    .wizard-step.active {
      border-bottom-color: var(--accent);
      color: var(--accent-dark);
    }

    .wizard-step.active span {
      background: var(--accent);
      color: #ffffff;
    }

    .wizard-panel {
      display: none;
    }

    .wizard-panel.active {
      display: block;
    }

    .wizard-panel h3 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .wizard-panel > p {
      margin: 7px 0 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .wizard-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .wizard-fields .wide {
      grid-column: 1 / -1;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .choice-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      cursor: pointer;
    }

    .choice-card:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 2px rgba(99, 91, 218, 0.08);
    }

    .choice-card input {
      accent-color: var(--accent);
    }

    .choice-card strong {
      font-size: 0.9rem;
    }

    .choice-card small {
      color: var(--muted);
      line-height: 1.4;
    }

    .wizard-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .secondary-button {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #ffffff;
      color: var(--muted-strong);
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #f8fafc;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:hover,
    .hero-button.primary:hover {
      background: var(--accent-dark);
      color: #ffffff;
    }

    .form-message {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(17,24,39,0.03);
      color: var(--muted-strong);
      font-size: 0.85rem;
      display: none;
    }

    .form-message.visible {
      display: block;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding: 20px 22px 0;
    }

    .report-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      padding: 18px;
      min-height: 120px;
    }

    .report-box strong {
      display: block;
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      margin-top: 12px;
    }

    .report-box span {
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .empty-state {
      padding: 18px 22px 22px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    @media (max-width: 980px) {
      .app-shell { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .content-grid,
      .report-grid,
      .summary-band,
      .form-grid {
        grid-template-columns: 1fr;
      }
      .metric-strip { border-right: 0; border-bottom: 1px solid var(--line); }
      .metric-strip:last-child { border-bottom: 0; }
    }

    @media (max-width: 620px) {
      .sidebar { padding: 16px; }
      .sidebar-nav { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .nav-group { gap: 4px; }
      .nav-label { display: none; }
      .nav-item { padding: 10px; }
      .topbar { padding: 16px; }
      .topbar-actions .icon-button { display: none; }
      .user-pill span { display: none; }
      .page { padding: 16px; }
      .hero-surface { padding: 22px; }
      .section-header { padding-left: 18px; padding-right: 18px; }
      .panel-body, .form-surface { padding-left: 18px; padding-right: 18px; }
      thead th, tbody td { padding-left: 14px; padding-right: 14px; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 620px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="brand">
        <span class="brand-mark">F</span>
        <span>Fairness Console</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-label">Overview</div>
          <button class="nav-item active" type="button" data-page="dashboard">Dashboard</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Evaluate</div>
          <button class="nav-item" type="button" data-page="evaluations">Evaluations</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Govern</div>
          <button class="nav-item" type="button" data-page="models">Models</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Insights</div>
          <button class="nav-item" type="button" data-page="reports">Reports</button>
        </div>
      </nav>
    </aside>

    <div class="main-panel">
      <header class="topbar">
        <div class="crumb">
          <span>Fairness</span>
          <span>/</span>
          <strong id="page-title">Dashboard</strong>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 4a7 7 0 015.607 11.942l4.386 4.387 1.414-1.414-4.387-4.386A7 7 0 0111 4zm0 2a5 5 0 100 10 5 5 0 000-10z" fill="currentColor"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Notifications">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a5 5 0 015 5v3.586l1.707 3.414H5.293L7 11.586V8a5 5 0 015-5zm0 18a2.5 2.5 0 01-2.45-2h4.9A2.5 2.5 0 0112 21z" fill="currentColor"/></svg>
          </button>
          <div class="user-pill">
            <div class="avatar">AL</div>
            <span>Alex Lee</span>
          </div>
        </div>
      </header>

      <main id="page-root" class="page" aria-live="polite"></main>
    </div>
  </div>

  <script>
    const pageRoot = document.getElementById('page-root');
    const pageTitle = document.getElementById('page-title');
    const navItems = [...document.querySelectorAll('.nav-item')];

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    }

    function dashboardPage() {
      return `
        <section class="hero-surface">
          <p class="eyebrow">Good afternoon, Alex</p>
          <h1>Make every model decision more trustworthy.</h1>
          <p>Track fairness across your AI portfolio, understand emerging risks, and keep governance work moving from review to resolution.</p>
          <div class="hero-actions">
            <button id="hero-new-audit" class="hero-button primary" type="button">Start an audit</button>
            <button class="hero-button" type="button">View monitoring</button>
          </div>
        </section>

        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Portfolio health</p>
              <h2>Fairness overview</h2>
            </div>
            <button class="header-action" type="button">Generate report</button>
          </div>

        const response = await fetch('/api/workflows', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error('Unable to create workflow');
        return response.json();
      }
    };

    const pageMap = {
      dashboard: { title: 'Dashboard', render: dashboardPage },
      evaluations: { title: 'Evaluations', render: evaluationPage },
      models: { title: 'Models', render: modelPage },
      reports: { title: 'Reports', render: reportsPage }

    function renderPage(pageKey) {
      const page = pageMap[pageKey] || pageMap.dashboard;
      pageTitle.textContent = page.title;
      pageRoot.innerHTML = page.render();
      navItems.forEach((item) => {
        item.classList.toggle('active', item.dataset.page === pageKey);
      });

      const newAuditButton = document.getElementById('hero-new-audit');
      if (newAuditButton) {
        newAuditButton.addEventListener('click', () => renderPage('evaluations'));
      }

      if (pageKey === 'evaluations') {
        bindWorkflowForm();
        loadWorkflows();
      }
    }

    function bindWorkflowForm() {
      const form = document.getElementById('workflow-form');
      if (!form) return;

      const panels = [...form.querySelectorAll('.wizard-panel')];
      const indicators = [...form.querySelectorAll('.wizard-step')];
      const backButton = document.getElementById('wizard-back');
      const nextButton = document.getElementById('wizard-next');
      const submitButton = document.getElementById('wizard-submit');
      const message = document.getElementById('form-message');
      let currentStep = 1;

      function showStep(step) {
        currentStep = step;
        panels.forEach((panel) => panel.classList.toggle('active', Number(panel.dataset.step) === step));
        indicators.forEach((indicator) => indicator.classList.toggle('active', Number(indicator.dataset.stepIndicator) <= step));
        backButton.hidden = step === 1;
        nextButton.hidden = step === 3;
        submitButton.hidden = step !== 3;

        if (step === 3) {
          document.getElementById('review-name').textContent = document.getElementById('workflow-name').value.trim() || '—';
          document.getElementById('review-model').textContent = document.getElementById('workflow-model').selectedOptions[0].textContent.split(' — ')[0];
          document.getElementById('review-attributes').textContent = document.getElementById('workflow-attributes').value.trim() || '—';
        }
      }

      function validateStep() {
        const fields = [...panels[currentStep - 1].querySelectorAll('input[required], select[required]')];
        const valid = fields.every((field) => field.reportValidity());
        if (!valid) return false;
        message.classList.remove('visible');
        return true;
      }

      nextButton.addEventListener('click', () => {
        if (validateStep()) showStep(Math.min(currentStep + 1, 3));
      });

      backButton.addEventListener('click', () => showStep(Math.max(currentStep - 1, 1)));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = {
          name: formData.get('name')?.trim() || '',
          protectedAttributes: (formData.get('protectedAttributes') || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean),
          targetColumn: formData.get('targetColumn')?.trim() || ''
        };

        if (!payload.name || !payload.protectedAttributes.length || !payload.targetColumn) {
          message.classList.add('visible');
          message.textContent = 'Please complete all fields before creating a workflow.';
          return;
        }

        try {
          await workflowService.create(payload);
          message.classList.add('visible');
          message.textContent = 'Audit created successfully and added to your evaluation catalog.';
          form.reset();
          showStep(1);
          await loadWorkflows();
        } catch (error) {
          message.classList.add('visible');
          message.textContent = 'The request could not be completed right now.';
        }
      }, { once: false });
    }

    async function loadWorkflows() {
      const tableWrap = document.getElementById('workflow-table-wrap');
      if (!tableWrap) return;

      try {
        const workflows = await workflowService.list();

        if (!workflows.length) {
          tableWrap.innerHTML = '<div class="empty-state">No evaluations yet. Create the first workflow to get started.</div>';
          return;
        }

        tableWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Workflow</th>
                <th>Protected attributes</th>
                <th>Target</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              ${workflows.map((item) => {
                const statusClass = item.status === 'PENDING' ? 'neutral' : item.status === 'FAILED' ? 'danger' : 'success';
                return `
                  <tr>
                    <td>${item.name}</td>
                    <td>${(item.protectedAttributes || []).join(', ') || '—'}</td>
                    <td>${item.targetColumn || '—'}</td>
                    <td><span class="status-pill ${statusClass}">${item.status}</span></td>
                    <td><span class="meta">${formatDate(item.createdAt)}</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        tableWrap.innerHTML = '<div class="empty-state">Unable to load evaluations at the moment.</div>';
      }
    }

    navItems.forEach((button) => {
      button.addEventListener('click', () => renderPage(button.dataset.page));
