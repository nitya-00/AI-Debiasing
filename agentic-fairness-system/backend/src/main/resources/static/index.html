<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairness Console</title>
  <style>
    :root { --ink:#17221f; --muted:#68746f; --paper:#f4f1e9; --card:#fffdf7; --teal:#0d7568; --coral:#e56f51; --line:#d9ded5; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 90% 0%, #d8eee5 0, transparent 34%), var(--paper); font:16px/1.5 Georgia, serif; }
    main { max-width:1080px; margin:auto; padding:48px 24px 72px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; border-bottom:1px solid var(--line); padding-bottom:28px; }
    h1 { font-size:clamp(2.5rem, 7vw, 5.8rem); line-height:.9; letter-spacing:-.04em; margin:0; max-width:560px; font-weight:500; }
    .kicker { color:var(--coral); font:700 12px/1.2 Arial, sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    .status { color:var(--teal); font:700 13px Arial, sans-serif; white-space:nowrap; }
    section { display:grid; grid-template-columns:1fr 1.35fr; gap:24px; margin-top:42px; }
    .panel { background:rgba(255,253,247,.88); border:1px solid var(--line); padding:26px; box-shadow:6px 6px 0 #dce7df; }
    h2 { font-size:1.7rem; margin:0 0 18px; font-weight:500; }
    label { display:block; color:var(--muted); font:12px Arial, sans-serif; letter-spacing:.06em; margin:16px 0 6px; text-transform:uppercase; }
    input { width:100%; border:1px solid var(--line); background:#fff; padding:12px; color:var(--ink); font:16px Georgia, serif; }
    button { border:0; background:var(--teal); color:white; cursor:pointer; padding:13px 18px; margin-top:20px; font:700 13px Arial, sans-serif; letter-spacing:.04em; text-transform:uppercase; }
    button:hover { background:#09584f; }
    .empty { color:var(--muted); border-left:3px solid var(--coral); padding-left:14px; }
    .workflow { border-top:1px solid var(--line); padding:16px 0; display:flex; justify-content:space-between; gap:16px; }
    .workflow strong { display:block; font-size:1.15rem; font-weight:500; }
    .workflow small { color:var(--muted); font:12px Arial, sans-serif; }
    .badge { color:var(--teal); font:700 11px Arial, sans-serif; letter-spacing:.08em; }
    @media (max-width:720px) { main { padding-top:28px; } header, section { display:block; } .status { display:block; margin-top:24px; } .panel + .panel { margin-top:28px; } }
  </style>
</head>
<body>
  <main>
    <header><div><div class="kicker">Agentic AI / fairness evaluation</div><h1>Make bias visible.</h1></div><div class="status" id="service-status">Checking API...</div></header>
    <section>
      <form class="panel" id="workflow-form">
        <h2>Start an evaluation</h2>
        <label for="name">Workflow name</label><input id="name" required placeholder="Hiring model review">
        <label for="attributes">Protected attributes</label><input id="attributes" required placeholder="gender, race">
        <label for="target">Target column</label><input id="target" required placeholder="prediction">
        <button type="submit">Create workflow</button>
        <p id="form-message" class="empty" hidden></p>
      </form>
      <div class="panel"><h2>Recent workflows</h2><div id="workflows" class="empty">Loading evaluations...</div></div>
    </section>
  </main>
  <script>
    const list = document.querySelector('#workflows');
    const status = document.querySelector('#service-status');
    const message = document.querySelector('#form-message');
    const formatDate = value => new Date(value).toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
    async function loadWorkflows() {
      const response = await fetch('/api/workflows');
      const workflows = await response.json();
      list.className = workflows.length ? '' : 'empty';
      list.innerHTML = workflows.length ? workflows.map(item => `<div class="workflow"><div><strong>${item.name}</strong><small>${item.protectedAttributes.join(', ')} / ${item.targetColumn}</small></div><div><span class="badge">${item.status}</span><br><small>${formatDate(item.createdAt)}</small></div></div>`).join('') : 'No evaluations yet. Create the first one.';
    }
    async function checkHealth() {
      try { const response = await fetch('/api/health'); status.textContent = response.ok ? '● API connected' : 'API unavailable'; }
      catch { status.textContent = 'API unavailable'; }
    }
    document.querySelector('#workflow-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/api/workflows', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name:document.querySelector('#name').value, protectedAttributes:document.querySelector('#attributes').value.split(',').map(value => value.trim()).filter(Boolean), targetColumn:document.querySelector('#target').value }) });
      message.hidden = false;
      message.textContent = response.ok ? 'Workflow created.' : 'Please complete all fields.';
      if (response.ok) { event.target.reset(); await loadWorkflows(); }
    });
    checkHealth(); loadWorkflows();
  </script>
</body>
</html>
