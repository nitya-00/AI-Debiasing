<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fairness Console</title>
  <style>
    :root {
      --bg: #f4f3f0;
      --panel: #fbfaf7;
      --panel-soft: #f2f2ed;
      --panel-strong: #eef2ee;
      --line: #dfe3dc;
      --line-strong: #cbd4cb;
      --ink: #171d1b;
      --muted: #606d68;
      --muted-strong: #3f4945;
      --accent: #0d5f58;
      --accent-soft: rgba(13, 95, 88, 0.08);
      --warning: #b76b1a;
      --warning-soft: rgba(183, 107, 26, 0.08);
      --danger: #a13f2d;
      --danger-soft: rgba(161, 63, 45, 0.08);
      --success: #1d6f52;
      --success-soft: rgba(29, 111, 82, 0.08);
      --shadow: 0 10px 22px rgba(16, 24, 40, 0.04);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      letter-spacing: -0.01em;
    }

    button, input {
      font: inherit;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      width: 260px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.2);
      padding: 24px 18px 28px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 8px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #f8fafc;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-label {
      padding: 0 10px;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: var(--muted-strong);
      border-left: 2px solid transparent;
      padding: 10px 12px 10px 14px;
      text-align: left;
      border-radius: 10px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .nav-item:hover {
      background: rgba(17, 24, 39, 0.02);
      color: var(--ink);
    }

    .nav-item.active {
      background: rgba(17, 24, 39, 0.04);
      border-left-color: var(--ink);
      color: var(--ink);
    }

    .main-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.1);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding: 20px 30px;
      background: rgba(255,255,255,0.3);
    }

    .topbar .crumb {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .topbar strong {
      color: var(--ink);
      letter-spacing: -0.03em;
      text-transform: none;
      font-size: 1.05rem;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-strong);
      padding: 0;
      cursor: pointer;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px 6px 6px;
      background: var(--panel);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--muted-strong);
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--panel-strong);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      border: 1px solid var(--line);
    }

    .page {
      padding: 28px 30px 38px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .section-surface {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.2);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px 0;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      letter-spacing: -0.04em;
    }

    .header-action {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .summary-band {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      margin-top: 18px;
    }

    .metric-strip {
      padding: 20px 22px;
      border-right: 1px solid var(--line);
      min-height: 120px;
    }

    .metric-strip:last-child { border-right: none; }

    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .metric-value {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 700;
      letter-spacing: -0.05em;
    }

    .metric-value strong {
      font-size: clamp(1.9rem, 3vw, 2.5rem);
      line-height: 1;
    }

    .metric-value span {
      font-size: 0.82rem;
      color: var(--success);
      background: var(--success-soft);
      border-radius: 999px;
      padding: 5px 8px;
      font-weight: 700;
    }

    .metric-value.negative span {
      color: var(--danger);
      background: var(--danger-soft);
    }

    .metric-sub {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1.5fr 0.9fr;
      gap: 22px;
    }

    .panel-body {
      padding: 20px 22px 22px;
    }

    .trend-chart {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      align-items: end;
      gap: 12px;
      height: 200px;
      padding-top: 14px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
    }

    .bar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 100%;
      justify-content: flex-end;
    }

    .bar {
      width: 100%;
      max-width: 42px;
      border-radius: 10px 10px 0 0;
      background: linear-gradient(180deg, #d8e7df 0%, #5d8f87 100%);
      min-height: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .bar-label {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .risk-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .risk-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 18px;
      align-items: center;
    }

    .risk-name {
      font-weight: 600;
      color: var(--muted-strong);
    }

    .risk-score {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
    }

    .progress {
      grid-column: 1 / -1;
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: rgba(17,24,39,0.06);
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #99b3a6 0%, #0d5f58 100%);
    }

    .table-wrap {
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.1);
    }

    thead th {
      text-align: left;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(17, 24, 39, 0.01);
    }

    tbody td {
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted-strong);
      vertical-align: middle;
    }

    tbody tr:last-child td { border-bottom: none; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-pill.success {
      background: var(--success-soft);
      color: var(--success);
    }

    .status-pill.warning {
      background: var(--warning-soft);
      color: var(--warning);
    }

    .status-pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .status-pill.neutral {
      background: rgba(17, 24, 39, 0.04);
      color: var(--muted-strong);
    }

    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .form-surface {
      padding: 20px 22px 22px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      margin-top: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .field input {
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 95, 88, 0.08);
    }

    .primary-button {
      border: 0;
      border-radius: 10px;
      background: var(--ink);
      color: #f8fafc;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .form-message {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(17,24,39,0.03);
      color: var(--muted-strong);
      font-size: 0.85rem;
      display: none;
    }

    .form-message.visible {
      display: block;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding: 20px 22px 0;
    }

    .report-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.15);
      padding: 18px;
      min-height: 120px;
    }

    .report-box strong {
      display: block;
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      margin-top: 12px;
    }

    .report-box span {
      color: var(--muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .empty-state {
      padding: 18px 22px 22px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    @media (max-width: 980px) {
      .app-shell { flex-direction: column; }
      .sidebar {
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .content-grid,
      .report-grid,
      .summary-band,
      .form-grid {
        grid-template-columns: 1fr;
      }
      .metric-strip { border-right: 0; border-bottom: 1px solid var(--line); }
      .metric-strip:last-child { border-bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Sidebar navigation">
      <div class="brand">
        <span class="brand-mark">F</span>
        <span>Fairness Console</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <div class="nav-label">Overview</div>
          <button class="nav-item active" type="button" data-page="dashboard">Dashboard</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Evaluate</div>
          <button class="nav-item" type="button" data-page="evaluations">Evaluations</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Govern</div>
          <button class="nav-item" type="button" data-page="models">Models</button>
        </div>

        <div class="nav-group">
          <div class="nav-label">Insights</div>
          <button class="nav-item" type="button" data-page="reports">Reports</button>
        </div>
      </nav>
    </aside>

    <div class="main-panel">
      <header class="topbar">
        <div class="crumb">
          <span>Fairness</span>
          <span>/</span>
          <strong id="page-title">Dashboard</strong>
        </div>

        <div class="topbar-actions">
          <button class="icon-button" type="button" aria-label="Search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M11 4a7 7 0 015.607 11.942l4.386 4.387 1.414-1.414-4.387-4.386A7 7 0 0111 4zm0 2a5 5 0 100 10 5 5 0 000-10z" fill="currentColor"/></svg>
          </button>
          <button class="icon-button" type="button" aria-label="Notifications">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a5 5 0 015 5v3.586l1.707 3.414H5.293L7 11.586V8a5 5 0 015-5zm0 18a2.5 2.5 0 01-2.45-2h4.9A2.5 2.5 0 0112 21z" fill="currentColor"/></svg>
          </button>
          <div class="user-pill">
            <div class="avatar">AL</div>
            <span>Alex Lee</span>
          </div>
        </div>
      </header>

      <main id="page-root" class="page" aria-live="polite"></main>
    </div>
  </div>

  <script>
    const pageRoot = document.getElementById('page-root');
    const pageTitle = document.getElementById('page-title');
    const navItems = [...document.querySelectorAll('.nav-item')];

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? '—' : date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    }

    function dashboardPage() {
      return `
        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Portfolio health</p>
              <h2>Fairness overview</h2>
            </div>
            <button class="header-action" type="button">Generate report</button>
          </div>

          <div class="summary-band">
            <div class="metric-strip">
              <span class="metric-label">Average score</span>
              <div class="metric-value"><strong>92.4</strong><span>+1.2%</span></div>
              <div class="metric-sub">Across 14 active evaluations</div>
            </div>
            <div class="metric-strip">
              <span class="metric-label">Risk bias</span>
              <div class="metric-value negative"><strong>4.8%</strong><span>-0.6%</span></div>
              <div class="metric-sub">Below policy threshold</div>
            </div>
            <div class="metric-strip">
              <span class="metric-label">Model coverage</span>
              <div class="metric-value"><strong>87%</strong><span>+5%</span></div>
              <div class="metric-sub">Experiments monitored</div>
            </div>
            <div class="metric-strip">
              <span class="metric-label">Open findings</span>
              <div class="metric-value"><strong>12</strong><span>3 urgent</span></div>
              <div class="metric-sub">Needs follow up this week</div>
            </div>
          </div>
        </section>

        <div class="content-grid">
          <section class="section-surface">
            <div class="section-header">
              <div>
                <p class="eyebrow">Trend</p>
                <h2>Fairness score by month</h2>
              </div>
            </div>
            <div class="panel-body">
              <div class="trend-chart" aria-label="Fairness trend chart">
                <div class="bar-wrap"><div class="bar" style="height: 52%"></div><div class="bar-label">Jan</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 58%"></div><div class="bar-label">Feb</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 61%"></div><div class="bar-label">Mar</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 73%"></div><div class="bar-label">Apr</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 78%"></div><div class="bar-label">May</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 84%"></div><div class="bar-label">Jun</div></div>
                <div class="bar-wrap"><div class="bar" style="height: 92%"></div><div class="bar-label">Jul</div></div>
              </div>
            </div>
          </section>

          <section class="section-surface">
            <div class="section-header">
              <div>
                <p class="eyebrow">Distribution</p>
                <h2>Risk by segment</h2>
              </div>
            </div>
            <div class="panel-body">
              <ul class="risk-list">
                <li class="risk-item">
                  <span class="risk-name">Gender</span>
                  <span class="risk-score">4.2%</span>
                  <div class="progress"><span style="width: 42%"></span></div>
                </li>
                <li class="risk-item">
                  <span class="risk-name">Age</span>
                  <span class="risk-score">6.1%</span>
                  <div class="progress"><span style="width: 61%"></span></div>
                </li>
                <li class="risk-item">
                  <span class="risk-name">Location</span>
                  <span class="risk-score">3.6%</span>
                  <div class="progress"><span style="width: 36%"></span></div>
                </li>
                <li class="risk-item">
                  <span class="risk-name">Income</span>
                  <span class="risk-score">7.4%</span>
                  <div class="progress"><span style="width: 74%"></span></div>
                </li>
              </ul>
            </div>
          </section>
        </div>

        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Recent activity</p>
              <h2>Latest evaluations</h2>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Evaluation</th>
                  <th>Model</th>
                  <th>Bias gap</th>
                  <th>Status</th>
                  <th>Updated</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Loan risk policy review</td>
                  <td>Credit-Exp-8</td>
                  <td>2.9 pts</td>
                  <td><span class="status-pill success">Healthy</span></td>
                  <td><span class="meta">2h ago</span></td>
                </tr>
                <tr>
                  <td>Candidate ranking audit</td>
                  <td>Talent-LM-v3</td>
                  <td>5.1 pts</td>
                  <td><span class="status-pill warning">Review</span></td>
                  <td><span class="meta">7h ago</span></td>
                </tr>
                <tr>
                  <td>Customer support triage</td>
                  <td>CareFlow-2</td>
                  <td>1.4 pts</td>
                  <td><span class="status-pill success">Healthy</span></td>
                  <td><span class="meta">Yesterday</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    function evaluationPage() {
      return `
        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Evaluate</p>
              <h2>Start a fairness check</h2>
            </div>
          </div>

          <div class="form-surface">
            <form id="workflow-form">
              <div class="form-grid">
                <div class="field">
                  <label for="workflow-name">Workflow name</label>
                  <input id="workflow-name" name="name" type="text" placeholder="Hiring model review" required>
                </div>
                <div class="field">
                  <label for="workflow-attributes">Protected attributes</label>
                  <input id="workflow-attributes" name="protectedAttributes" type="text" placeholder="gender, race" required>
                </div>
                <div class="field">
                  <label for="workflow-target">Target column</label>
                  <input id="workflow-target" name="targetColumn" type="text" placeholder="prediction" required>
                </div>
                <button class="primary-button" type="submit">Create workflow</button>
              </div>
              <p id="form-message" class="form-message" aria-live="polite"></p>
            </form>
          </div>
        </section>

        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Catalog</p>
              <h2>Active evaluations</h2>
            </div>
          </div>
          <div id="workflow-table-wrap" class="table-wrap"></div>
        </section>
      `;
    }

    function modelPage() {
      return `
        <section class="section-surface">
          <div class="section-header">
            <div>
              <p class="eyebrow">Model governance</p>
              <h2>Production model health</h2>
            </div>
          </div>

    function reportsPage() {

    const pageMap = {
      dashboard: { title: 'Dashboard', render: dashboardPage },
      evaluations: { title: 'Evaluations', render: evaluationPage },
      models: { title: 'Models', render: modelPage },
      reports: { title: 'Reports', render: reportsPage }
    };

    function renderPage(pageKey) {
      const page = pageMap[pageKey] || pageMap.dashboard;
      pageTitle.textContent = page.title;
      pageRoot.innerHTML = page.render();
      navItems.forEach((item) => {
        item.classList.toggle('active', item.dataset.page === pageKey);
      });

      if (pageKey === 'evaluations') {
        bindWorkflowForm();
        loadWorkflows();
      }
    }

    function bindWorkflowForm() {
      const form = document.getElementById('workflow-form');
      if (!form) return;

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const payload = {
          name: formData.get('name')?.trim() || '',
          protectedAttributes: (formData.get('protectedAttributes') || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean),
          targetColumn: formData.get('targetColumn')?.trim() || ''
        };

        const message = document.getElementById('form-message');
        if (!payload.name || !payload.protectedAttributes.length || !payload.targetColumn) {
          message.classList.add('visible');
          message.textContent = 'Please complete all fields before creating a workflow.';
          return;
        }

        try {
          const response = await fetch('/api/workflows', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error('Unable to create workflow');
          }

          message.classList.add('visible');
          message.textContent = 'Workflow created successfully.';
          form.reset();
          await loadWorkflows();
        } catch (error) {
          message.classList.add('visible');
          message.textContent = 'The request could not be completed right now.';
        }
      }, { once: false });
    }

    async function loadWorkflows() {
      const tableWrap = document.getElementById('workflow-table-wrap');
      if (!tableWrap) return;

      try {
        const response = await fetch('/api/workflows');
        if (!response.ok) throw new Error('Request failed');
        const workflows = await response.json();

        if (!workflows.length) {
          tableWrap.innerHTML = '<div class="empty-state">No evaluations yet. Create the first workflow to get started.</div>';
          return;
        }

        tableWrap.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Workflow</th>
                <th>Protected attributes</th>
                <th>Target</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              ${workflows.map((item) => {
                const statusClass = item.status === 'PENDING' ? 'neutral' : item.status === 'FAILED' ? 'danger' : 'success';
                return `
                  <tr>
                    <td>${item.name}</td>
                    <td>${(item.protectedAttributes || []).join(', ') || '—'}</td>
                    <td>${item.targetColumn || '—'}</td>
                    <td><span class="status-pill ${statusClass}">${item.status}</span></td>
                    <td><span class="meta">${formatDate(item.createdAt)}</span></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        tableWrap.innerHTML = '<div class="empty-state">Unable to load evaluations at the moment.</div>';
      }
    }

    navItems.forEach((button) => {
      button.addEventListener('click', () => renderPage(button.dataset.page));
    });

    renderPage('dashboard');
  </script>
</body>
</html>
